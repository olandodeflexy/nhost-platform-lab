name: Setup Nix
description: Install Nix with flakes enabled for the repository build interface

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          keep-outputs = true
          keep-derivations = true
