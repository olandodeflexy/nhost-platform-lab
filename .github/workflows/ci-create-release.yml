name: "ci: create release"

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release(demo-api):')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract release version
        id: release
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TITLE" =~ ^release\(demo-api\):[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "title must be release(demo-api): X.Y.Z" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=demo-api@$version" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --target main
          --title "$TAG"
          --generate-notes
