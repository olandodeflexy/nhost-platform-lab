name: "demo-api: release"

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: demo-api-nonprod
  cancel-in-progress: false

jobs:
  delivery:
    if: startsWith(github.event.release.tag_name, 'demo-api@')
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: olandodeflexy/nhost-platform-lab/.github/workflows/demo-api-release-delivery.yml@main
    with:
      release_tag: ${{ github.event.release.tag_name }}
