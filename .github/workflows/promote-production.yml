name: "demo-api: promote production"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released demo-api version in X.Y.Z format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: demo-api-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.inputs.outputs.tag }}
      tooling_commit: ${{ steps.source.outputs.tooling_commit }}
      version: ${{ steps.inputs.outputs.version }}

    steps:
      - name: Validate release version
        id: inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "production promotion must run from the default branch" >&2
            exit 1
          fi
          echo "tag=demo-api@$VERSION" >>"$GITHUB_OUTPUT"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

      - name: Check out trusted promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve immutable release and tooling commits
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          tooling_commit="$(git rev-parse HEAD)"
          for revision in "$commit" "$tooling_commit"; do
            if [[ ! "$revision" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
              echo "release or tooling reference did not resolve to a Git commit" >&2
              exit 1
            fi
          done
          published_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq 'select(.draft == false and .prerelease == false) | .tag_name')"
          if [ "$published_tag" != "$RELEASE_TAG" ]; then
            echo "production requires a published, non-prerelease GitHub release" >&2
            exit 1
          fi
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "tooling_commit=$tooling_commit" >>"$GITHUB_OUTPUT"

  deploy:
    needs:
      - validate
    permissions:
      attestations: read
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - overlay: prod-eu-west-1
            region: eu-west-1
            cluster_variable: PROD_EU_CLUSTER_NAME
            runner: '["self-hosted","linux","prod-eu-west-1"]'
          - overlay: prod-us-east-1
            region: us-east-1
            cluster_variable: PROD_US_CLUSTER_NAME
            runner: '["self-hosted","linux","prod-us-east-1"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: production
    timeout-minutes: 60

    steps:
      - name: Check out trusted promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tooling_commit }}

      - name: Check out verified release manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_PROD_ACCOUNT_ID }}:role/github-actions-nhost-platform-lab-deploy
          aws-region: ${{ matrix.region }}
          allowed-account-ids: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
          mask-aws-account-id: true
          output-credentials: false
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.region }}
          unset-current-credentials: true

      - name: Resolve and verify promoted regional image
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix run --no-update-lock-file .#verify-promotion --
          "${{ secrets.AWS_CORE_ACCOUNT_ID }}"
          "${{ vars.ECR_REGION }}"
          "${{ matrix.region }}"
          "${{ vars.ECR_REPOSITORY }}"
          "${{ needs.validate.outputs.version }}"
          "${{ github.repository }}"
          "${{ needs.validate.outputs.commit }}"

      - name: Select cluster
        id: cluster
        env:
          CLUSTER_VARIABLE: ${{ matrix.cluster_variable }}
          PROD_EU_CLUSTER_NAME: ${{ vars.PROD_EU_CLUSTER_NAME }}
          PROD_US_CLUSTER_NAME: ${{ vars.PROD_US_CLUSTER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          cluster_name="${!CLUSTER_VARIABLE}"
          if [ -z "$cluster_name" ]; then
            echo "cluster variable $CLUSTER_VARIABLE is empty" >&2
            exit 1
          fi
          echo "name=$cluster_name" >>"$GITHUB_OUTPUT"

      - name: Deploy tested image digest
        env:
          IMAGE_URI: ${{ secrets.AWS_CORE_ACCOUNT_ID }}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}
          KUSTOMIZE_ROOT: ${{ github.workspace }}/release/deploy/kustomize
        run: >-
          nix run --no-update-lock-file .#deploy --
          "${{ matrix.overlay }}"
          "${{ steps.cluster.outputs.name }}"
          "${{ matrix.region }}"
          "$IMAGE_URI"
          "${{ steps.promotion.outputs.digest }}"
