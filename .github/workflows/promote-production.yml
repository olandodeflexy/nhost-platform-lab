name: "demo-api: promote production"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released demo-api version in X.Y.Z format
        required: true
        type: string

permissions: {}

concurrency:
  group: demo-api-production
  cancel-in-progress: false

jobs:
  delivery:
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: olandodeflexy/nhost-platform-lab/.github/workflows/demo-api-production-delivery.yml@main
    with:
      version: ${{ inputs.version }}
