name: "security: release bot auth check"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-release-bot-auth-check
  cancel-in-progress: true

jobs:
  verify-release-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Generate repository-scoped read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: read

      - name: Verify repository and permission scope
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          repositories_json="$(
            gh api --method GET /installation/repositories \
              -f per_page=100
          )"
          if ! printf '%s' "$repositories_json" | jq -e \
            --arg repository "$EXPECTED_REPOSITORY" '
              .total_count == 1 and
              (.repositories | length) == 1 and
              .repositories[0].full_name == $repository
            ' >/dev/null; then
            echo "release App token is not scoped to exactly this repository" >&2
            exit 1
          fi

          repository_json="$(
            gh api --method GET "repos/${EXPECTED_REPOSITORY}"
          )"
          if ! printf '%s' "$repository_json" | jq -e \
            --arg repository "$EXPECTED_REPOSITORY" '
              .full_name == $repository and
              .archived == false and
              .disabled == false
            ' >/dev/null; then
            echo "release App token cannot read the expected active repository" >&2
            exit 1
          fi

          # Creating a Git blob requires Contents: write. This deliberately
          # invalid request omits required content and uses an unsupported
          # encoding, so it cannot create an object even if authorization is
          # unexpectedly granted.
          set +e
          probe_response="$(
            gh api \
              --method POST \
              --include \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${EXPECTED_REPOSITORY}/git/blobs" \
              -f encoding=unsupported-for-read-only-probe \
              2>/dev/null
          )"
          probe_exit=$?
          set -e

          probe_status="$(
            printf '%s\n' "$probe_response" |
              awk '/^HTTP\// { status = $2 } END { print status }'
          )"
          accepted_permissions="$(
            printf '%s\n' "$probe_response" |
              awk -F ': *' '
                tolower($1) == "x-accepted-github-permissions" {
                  gsub(/\r/, "", $2)
                  permissions = tolower($2)
                }
                END { print permissions }
              '
          )"
          probe_message="$(
            printf '%s\n' "$probe_response" |
              awk '
                body { print }
                /^\r?$/ { body = 1 }
              ' |
              jq -r '.message // empty'
          )"

          if [[ "$probe_exit" -eq 0 ]] ||
            [[ "$probe_status" != "403" ]] ||
            [[ "$accepted_permissions" != *"contents=write"* ]] ||
            [[ "$probe_message" != "Resource not accessible by integration" ]]; then
            echo "release App token was not conclusively denied Contents: write" >&2
            echo "HTTP status: ${probe_status:-missing}" >&2
            echo "Required permissions: ${accepted_permissions:-missing}" >&2
            echo "API message: ${probe_message:-missing}" >&2
            exit 1
          fi

          {
            echo "### Release bot authentication"
            echo
            echo "- Repository: \`${EXPECTED_REPOSITORY}\`"
            echo "- Installation scope: current repository only"
            echo "- Smoke-test token: read-only contents"
            echo "- Result: verified"
          } >>"$GITHUB_STEP_SUMMARY"
