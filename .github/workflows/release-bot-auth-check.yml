name: "security: release bot auth check"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-release-bot-auth-check
  cancel-in-progress: true

jobs:
  verify-release-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Generate repository-scoped read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: read

      - name: Verify repository and permission scope
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          repositories_json="$(
            gh api --method GET /installation/repositories \
              -f per_page=100
          )"
          if ! printf '%s' "$repositories_json" | jq -e \
            --arg repository "$EXPECTED_REPOSITORY" '
              .total_count == 1 and
              (.repositories | length) == 1 and
              .repositories[0].full_name == $repository
            ' >/dev/null; then
            echo "release App token is not scoped to exactly this repository" >&2
            exit 1
          fi

          repository_json="$(
            gh api --method GET "repos/${EXPECTED_REPOSITORY}"
          )"
          if ! printf '%s' "$repository_json" | jq -e \
            --arg repository "$EXPECTED_REPOSITORY" '
              .full_name == $repository and
              .permissions.pull == true and
              .permissions.push == false and
              .permissions.admin == false
            ' >/dev/null; then
            echo "release App smoke-test token is not read-only" >&2
            exit 1
          fi

          {
            echo "### Release bot authentication"
            echo
            echo "- Repository: \`${EXPECTED_REPOSITORY}\`"
            echo "- Installation scope: current repository only"
            echo "- Smoke-test token: read-only contents"
            echo "- Result: verified"
          } >>"$GITHUB_STEP_SUMMARY"
