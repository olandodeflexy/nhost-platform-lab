apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ required "storageClass.name is required" .Values.storageClass.name | quote }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  csi.storage.k8s.io/fstype: ext4
  tagSpecification_1: {{ printf "ebs.csi.aws.com/cluster-name=%s" (required "clusterName is required" .Values.clusterName) | quote }}
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
