apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general
spec:
  role: {{ required "karpenter.nodeRole is required" .Values.karpenter.nodeRole | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.karpenter.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Environment: {{ .Values.environment | quote }}
    ManagedBy: karpenter
    Project: nhost-platform-lab
    ebs.csi.aws.com/cluster-name: {{ .Values.clusterName | quote }}
